name: GTFS verisini güncelle

on:
  schedule:
    - cron: "17 2 * * *"   # her gün 02:17 UTC (05:17 İstanbul)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-gtfs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: GTFS indir ve JSON üret
        env:
          # İsteğe bağlı: portal adresi değişirse Settings > Secrets and variables > Actions > Variables
          GTFS_URL: ${{ vars.GTFS_URL }}
        run: python scripts/fetch_gtfs.py
      - name: Değişiklik varsa commit et
        run: |
          git config user.name "gtfs-bot"
          git config user.email "gtfs-bot@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "Değişiklik yok"
          else
            git commit -m "veri: GTFS günlük güncelleme $(date -u +%F)"
            git push
          fi
